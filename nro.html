<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngọc Rồng Online - Web Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: #0b0c10;
            background-image: url('https://i.imgur.com/83pZ25f.png'); /* Hình nền phong cảnh NRO mặc định */
            background-size: cover;
            background-position: center;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Thanh thông tin trên cùng giống hệt ảnh mẫu */
        .top-bar-fps {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #f1c40f;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 1px 1px #000;
        }

        .top-bar-version {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 1px 1px #000;
            text-align: right;
        }

        /* Khung chứa giả lập Canvas trung tâm */
        .emulator-box {
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #f1c40f;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 720px;
            height: 480px;
            background: #000;
            image-rendering: pixelated;
        }

        /* Nút chọn file .jar ẩn hoặc hiện khi cần */
        .load-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 12, 16, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .btn-start-game {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: white;
            border: 2px solid #f1c40f;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
        }
        .btn-start-game:hover { transform: scale(1.05); }
    </style>

    <!-- Thư viện lõi máy ảo FreeJ2ME Web chuẩn -->
    <script src="https://zb3.me/freej2me-web/freej2me.js"></script>
</head>
<body>

    <!-- Thông số góc màn hình giống ảnh mẫu -->
    <div class="top-bar-fps" id="fpsCounter">FPS: 60</div>
    <div class="top-bar-version">
        Mod Của Bạn Pro<br>
        <span style="font-size: 0.75rem; color: #f1c40f;">v2.4.7(3)</span>
    </div>

    <div class="emulator-box">
        <!-- Màn hình chờ nạp file .JAR -->
        <div class="load-overlay" id="loadOverlay">
            <h2 style="color: #f1c40f; text-shadow: 2px 2px #000;">🐉 TRANG CHỦ CHƠI NRO TRỰC TIẾP</h2>
            <p style="color: #aaa; font-size: 0.9rem;">Chọn file .JAR bản mod của bạn để khởi chạy</p>
            
            <label class="btn-start-game">
                📁 CHỌN FILE .JAR NRO NGAY
                <input type="file" id="jarInput" accept=".jar" style="display: none;" onchange="runNROJar(event)">
            </label>
        </div>

        <!-- Canvas hiển thị game thật -->
        <canvas id="canvas" width="720" height="480"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');

        // Giả lập đếm FPS mượt mà
        let frameCount = 0;
        setInterval(() => {
            document.getElementById('fpsCounter').innerText = "FPS " + (55 + Math.floor(Math.random() * 6));
        }, 1000);

        function runNROJar(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Ẩn bảng chọn file
            document.getElementById('loadOverlay').style.display = 'none';

            const jarUrl = URL.createObjectURL(file);
            console.log("Đang nạp file JAR:", jarUrl);

            // Khởi chạy máy ảo FreeJ2ME Web
            if (typeof FreeJ2ME !== "undefined") {
                try {
                    FreeJ2ME.start({
                        canvas: canvas,
                        jar: jarUrl,
                        scale: 'fit'
                    });
                } catch (err) {
                    console.error("Lỗi chạy máy ảo:", err);
                    alert("Không thể khởi động máy ảo với file này!");
                }
            } else {
                alert("Không tải được thư viện máy ảo J2ME!");
            }
        }
    </script>
</body>
</html>
