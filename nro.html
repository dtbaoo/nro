<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRO Web Emulator Player</title>
    <style>
        body { background: #0b0c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .panel { background: #1f2833; padding: 20px; border-radius: 8px; border: 2px solid #66fcf1; text-align: center; margin-bottom: 15px; }
        input[type="file"] { margin-bottom: 10px; color: #fff; }
        button { background: #66fcf1; color: #0b0c10; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #45a29e; }
        canvas { border: 3px solid #f1c40f; background: #000; display: block; image-rendering: pixelated; width: 240px; height: 320px; }
    </style>
</head>
<body>
    <div class="panel" id="loaderPanel">
        <h3>Trình Chạy NRO .JAR Trực Tiếp</h3>
        <p>Chọn file .jar mod của bạn để khởi động:</p>
        <input type="file" id="jarFile" accept=".jar"><br>
        <button onclick="initEmulator()">Khởi Chạy Game</button>
    </div>

    <canvas id="gameCanvas" width="240" height="320"></canvas>

    <!-- Thư viện lõi máy ảo J2ME Web -->
    <script src="https://cdn.jsdelivr.net/gh/casualit/j2me-web@main/build/j2me.js"></script>
    <script>
        function initEmulator() {
            const fileInput = document.getElementById('jarFile');
            if (!fileInput.files.length) {
                alert("Vui lòng chọn file .jar trước!");
                return;
            }
            const file = fileInput.files[0];
            const jarUrl = URL.createObjectURL(file);

            // Ẩn bảng chọn file
            document.getElementById('loaderPanel').style.display = 'none';
            const canvas = document.getElementById('gameCanvas');

            if (typeof J2ME !== 'undefined' && J2ME.run) {
                try {
                    J2ME.run({
                        canvas: canvas,
                        jar: jarUrl
                    });
                } catch (e) {
                    console.error("Lỗi chạy giả lập:", e);
                    alert("Không thể khởi chạy file .jar này trên máy ảo!");
                }
            } else {
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f1c40f';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("Đang xử lý: " + file.name, canvas.width / 2, canvas.height / 2);
            }
        }
    </script>
</body>
</html>
