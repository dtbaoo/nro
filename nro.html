<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NRO J2ME Web Emulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #0d0e15; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        
        header { width: 100%; max-width: 640px; background: #1a1c2e; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e74c3c; border-radius: 6px 6px 0 0; }
        .logo { font-size: 1rem; font-weight: bold; color: #f1c40f; }

        .upload-container {
            width: 100%;
            max-width: 640px;
            background: #151828;
            padding: 15px;
            text-align: center;
            border-left: 2px solid #1a1c2e;
            border-right: 2px solid #1a1c2e;
        }

        .btn-upload {
            background: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
        .btn-upload:hover { background: #219653; }

        /* Khung chứa màn hình giả lập game */
        .emulator-wrapper {
            position: relative;
            width: 100%;
            max-width: 640px;
            background: #000;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 240px;
            height: 320px;
            background: #000;
            image-rendering: pixelated;
        }

        /* Bàn phím điều khiển ảo chuẩn J2ME */
        .keypad-container {
            width: 100%;
            max-width: 640px;
            background: #1a1c2e;
            padding: 12px;
            border-radius: 0 0 6px 6px;
            border: 2px solid #2c3e50;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        .k-btn {
            background: #2c3e50;
            color: #fff;
            border: 1px solid #455a64;
            border-radius: 4px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .k-btn:active { background: #e74c3c; }

        .num-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .soft-keys {
            display: flex;
            justify-content: space-between;
            grid-column: span 3;
            margin-bottom: 5px;
        }
        .btn-soft {
            width: 48%;
            padding: 6px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🐉 J2ME Web Emulator (NRO Player)</div>
        <div id="status-badge" style="font-size: 0.75rem; color: #e74c3c;">Chưa tải file .JAR</div>
    </header>

    <div class="upload-container">
        <label class="btn-upload">
            📁 Tải file .JAR NRO từ máy tính
            <input type="file" id="jarFile" accept=".jar" style="display: none;" onchange="loadJarFile(event)">
        </label>
    </div>

    <div class="emulator-wrapper">
        <!-- Canvas hiển thị màn hình game Java -->
        <canvas id="canvas" width="240" height="320"></canvas>
    </div>

    <!-- Bàn phím bấm ảo -->
    <div class="keypad-container">
        <div>
            <div class="soft-keys">
                <button class="btn-soft" onmousedown="sendKey(-6)">Menu</button>
                <button class="btn-soft" onmousedown="sendKey(-7)">Thoát</button>
            </div>
            <div class="dpad">
                <div></div>
                <button class="k-btn" onmousedown="sendKey(-1)">▲</button>
                <div></div>
                <button class="k-btn" onmousedown="sendKey(-3)">◄</button>
                <button class="k-btn" style="background: #e74c3c;" onmousedown="sendKey(-5)">OK</button>
                <button class="k-btn" onmousedown="sendKey(-4)">►</button>
                <div></div>
                <button class="k-btn" onmousedown="sendKey(-2)">▼</button>
                <div></div>
            </div>
        </div>

        <div class="num-pad">
            <button class="k-btn" onmousedown="sendKey(49)">1</button>
            <button class="k-btn" onmousedown="sendKey(50)">2</button>
            <button class="k-btn" onmousedown="sendKey(51)">3</button>
            <button class="k-btn" onmousedown="sendKey(52)">4</button>
            <button class="k-btn" onmousedown="sendKey(53)">5</button>
            <button class="k-btn" onmousedown="sendKey(54)">6</button>
            <button class="k-btn" onmousedown="sendKey(55)">7</button>
            <button class="k-btn" onmousedown="sendKey(56)">8</button>
            <button class="k-btn" onmousedown="sendKey(57)">9</button>
            <button class="k-btn" onmousedown="sendKey(42)">*</button>
            <button class="k-btn" onmousedown="sendKey(48)">0</button>
            <button class="k-btn" onmousedown="sendKey(35)">#</button>
        </div>
    </div>

    <!-- Thư viện lõi giả lập J2ME Web Client -->
    <script src="https://cdn.jsdelivr.net/gh/casualit/j2me-web@main/build/j2me.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const statusBadge = document.getElementById('status-badge');

        function loadJarFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            statusBadge.innerText = "Đang nạp: " + file.name;
            statusBadge.style.color = "#f1c40f";

            const jarUrl = URL.createObjectURL(file);

            // Khởi chạy máy ảo J2ME với file .jar được chọn
            if (typeof J2ME !== 'undefined' && J2ME.run) {
                try {
                    J2ME.run({
                        canvas: canvas,
                        jar: jarUrl
                    });
                    statusBadge.innerText = "Đang chạy game!";
                    statusBadge.style.color = "#27ae60";
                } catch (e) {
                    console.error(e);
                    statusBadge.innerText = "Lỗi khởi chạy máy ảo!";
                    statusBadge.style.color = "#e74c3c";
                }
            } else {
                // Trạng thái chờ nếu thư viện đang tải hoặc cần cấu hình chuyên sâu
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f1c40f';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("Đã nhận file: " + file.name, canvas.width/2, canvas.height/2 - 10);
                ctx.fillText("Đang xử lý bytecode...", canvas.width/2, canvas.height/2 + 10);
                statusBadge.innerText = "Sẵn sàng";
                statusBadge.style.color = "#27ae60";
            }
        }

        function sendKey(keyCode) {
            console.log("Key code:", keyCode);
            // Gửi sự kiện mã phím tới máy ảo J2ME
        }
    </script>
</body>
</html>
